name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests tools --select E9,F63,F7,F82,F401
      - run: python -m build

  # Native BLAST tests are opt-in locally via BLAST_BIN. No large reference
  # downloads or blastn-task searches are launched by this workflow.
