
[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apscale-blast2"
version = "1.2.1"
description = "Local BLAST-based taxonomic assignment for metabarcoding with curated databases, auditable consensus and bounded-memory hit processing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "You"}]
dependencies = ["pandas>=2.0","openpyxl>=3.1","pyarrow>=12","tqdm>=4.66"]
[project.scripts]
apscale_blast2 = "apscale_blast2.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
